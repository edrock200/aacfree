name: iOS app

on:
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Sign the app and upload it to App Store Connect / TestFlight (needs the App Store secrets; main only)'
        type: boolean
        default: false

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (the tag is in the comment).
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npx cap sync ios
      # Every run: check that the native project and its Swift plugins compile.
      - name: Build for the iOS Simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build | tail -n 40
      # Start the app on an iPad simulator: it must keep running, draw the first screen and log no
      # JavaScript errors (Capacitor forwards the web console to the system log in Debug builds).
      - name: Launch in the iPad Simulator
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPad')))")
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b > /dev/null
          xcrun simctl install "$DEV" build/sim/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEV" com.aacappfree.app
          sleep 25
          xcrun simctl io "$DEV" screenshot build/ipad.png
          xcrun simctl spawn "$DEV" log show --last 2m --style compact --predicate 'process == "App"' > build/app.log || true
          grep -E "⚡️|error|Error" build/app.log | grep -v "Load failed for asset" | tail -n 40 || true
          if ! xcrun simctl spawn "$DEV" launchctl list | grep -q com.aacappfree.app; then echo "::error::The app is not running (it crashed)."; exit 1; fi
          python3 -m pip install --quiet --user pillow
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('build/ipad.png').convert('RGB').resize((200, 150))
          colours = len(set(im.getdata()))
          print(f'Screenshot {Image.open("build/ipad.png").size}, {colours} colours')
          if colours < 20:
              raise SystemExit('::error::The first screen looks blank.')
          PY
          if grep -q "⚡️  \[error\]" build/app.log; then echo "::error::JavaScript errors in the app (see above)."; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-simulator
          path: |
            build/ipad.png
            build/app.log
          if-no-files-found: ignore
      # Upload: add repository secrets APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8
      # (the contents of the App Store Connect API key's .p8 file, Admin access). See docs/app-store.md.
      - name: Archive and upload to App Store Connect
        if: github.event_name == 'workflow_dispatch' && inputs.upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then echo "::error::Upload from main only."; exit 1; fi
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set. See docs/app-store.md."; exit 1; fi
          done
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); a*10000+b*100+c")
          BUILD="$CODE.$GITHUB_RUN_NUMBER"
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/AACFree.xcarchive archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" "${AUTH[@]}" | tail -n 40
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/AACFree.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export "${AUTH[@]}" | tail -n 40
          rm -f "$KEY"
          echo "::notice::Uploaded AACFree $VERSION ($BUILD). It appears in App Store Connect → TestFlight after processing."
