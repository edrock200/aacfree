name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (the tag is in the comment).
env:
  # Playwright is preinstalled locally; CI installs this exact version.
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end checks (Playwright)
        run: |
          npm install --no-save "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8.0.3 http://localhost:4173/
          npm run e2e
