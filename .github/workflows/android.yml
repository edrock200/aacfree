name: Android APK

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release for the package.json version (creates the v<version> tag; main only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the removed 'tools' package, which makes sdkmanager fail.
          packages: 'platform-tools build-tools;36.0.0'
      - run: npm ci
      - run: npx tsc --noEmit -p . && npm test
      - run: npm run build && npx cap sync android
      # Signing: add repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to build and sign here.
      # Without them, a release tag publishes the committed release/caleb-latest.apk, but only if
      # its version matches the tag and it is signed with Caleb's release key (pinned below).
      # Other runs produce a debug-signed APK.
      - name: Build APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: 4158144afae7107a6a0c8f0480f1935000bd5009fa502d5d27fd1786f6543824
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          VERSION=$(node -p "require('../package.json').version")
          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* || "$PUBLISH" == "true" ]]; then RELEASE=true; fi
          if [[ "$PUBLISH" == "true" && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Publish releases from main only."
            exit 1
          fi
          OUT="caleb-v$VERSION.apk"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION."
            exit 1
          fi
          if [ -n "$KS_B64" ]; then
            mkdir -p signing
            echo "$KS_B64" | base64 -d > signing/release.jks
            printf 'storeFile=signing/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "../$OUT"
          elif [[ "$RELEASE" == "true" ]]; then
            BT="$ANDROID_HOME/build-tools/36.0.0"
            APK=../release/caleb-latest.apk
            NAME=$("$BT/aapt2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
            CERT=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            if [ "$NAME" != "$VERSION" ]; then
              echo "::error::release/caleb-latest.apk is version '$NAME', not $VERSION. Rebuild it (build-android skill) or add the signing secrets."
              exit 1
            fi
            if [ "$CERT" != "$RELEASE_CERT_SHA256" ]; then
              echo "::error::release/caleb-latest.apk is not signed with Caleb's release key. Updates would fail to install."
              exit 1
            fi
            cp "$APK" "../$OUT"
          else
            echo "::warning::No signing secrets set; building a debug-signed APK."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../$OUT"
          fi
          # Same file under a fixed name, so the newest release is always at
          # https://github.com/<owner>/<repo>/releases/latest/download/caleb.apk
          cp "../$OUT" ../caleb.apk
      - uses: actions/upload-artifact@v4
        with:
          name: caleb-apk
          path: |
            caleb-v*.apk
            caleb.apk

  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: caleb-apk
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          awk -v v="$V" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          if ! grep -q '[[:alnum:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $V' section. Add one before tagging."
            exit 1
          fi
          {
            echo
            echo "---"
            echo "**Install on Android (7.0+):** download \`caleb.apk\` below, open it, and allow \"install unknown apps\". Updating keeps all boards and settings."
            echo
            echo "**Fire TV / Android TV / Fire tablet:** in the Downloader app, enter code **5791841** (or go to http://aftv.news/5791841)."
            echo
            echo "The newest version is always at https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/caleb.apk"
            echo
            echo "Web app: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/app/"
          } >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.notes.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Caleb v${{ steps.notes.outputs.version }}
          body_path: notes.md
          make_latest: true
          files: |
            caleb.apk
            caleb-v*.apk
