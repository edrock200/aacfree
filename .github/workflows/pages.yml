name: Website (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (the tag is in the comment).
env:
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:site
      # Nothing is deployed unless the functional end-to-end checks pass on this exact build.
      - name: End-to-end checks (Playwright)
        run: |
          npm install --no-save "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8.0.3 http://localhost:4173/
          npm run e2e
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A build that waited in the queue must never replace a newer site: deploy only if this
      # commit is still the tip of main.
      - name: Skip builds of an older commit
        id: fresh
        run: |
          head=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ -n "$head" ] && [ "$head" != "${{ github.sha }}" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Not deploying ${{ github.sha }}: main is now at $head."
          fi
      - id: deployment
        if: steps.fresh.outputs.stale != 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
